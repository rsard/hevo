# Deployed as /opt/hevo/docker-compose.yml on the PROD instance.
# Postgres is external (RDS) — no db service here.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    image: ${IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis

  celery-worker:
    image: ${IMAGE}
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis

  celery-beat:
    image: ${IMAGE}
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  redis_data:
  caddy_data:
  caddy_config:
