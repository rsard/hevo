# Deployed as /opt/hevo/docker-compose.yml on the DEV instance.
# Postgres runs as a local container here (no RDS) to keep dev cheap.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hevo
      POSTGRES_PASSWORD: hevo
      POSTGRES_DB: hevo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    image: ${IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-worker:
    image: ${IMAGE}
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    image: ${IMAGE}
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
