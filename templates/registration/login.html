{% extends 'base.html' %}
{% load static %}

{% block title %}Entrar - Hevo{% endblock %}

{% block content %}
<div class="auth-page">
    <img src="{% static 'branding/hevo_logo_white.png' %}" alt="Hevo" class="auth-logo">
    <div class="auth-card">
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if form.errors %}
            <p class="form-error">Usuário ou senha inválidos.</p>
            {% endif %}
            <label>
                Usuário
                {{ form.username }}
            </label>
            <label>
                Senha
                {{ form.password }}
            </label>
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
