{% extends 'base.html' %}
{% load static %}

{% block title %}Entrar - Hevo{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-hevo p-4">
    <img src="{% static 'branding/hevo_logo_white.png' %}" alt="Hevo" style="height: 72px;" class="mb-2">
    <p class="text-white mb-5" style="letter-spacing: 0.08em;">
        Inteligência humana e artificial para vender eventos.
    </p>
    <div class="card p-4" style="width: 100%; max-width: 360px;">
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">Usuário ou senha inválidos.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-hevo w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
