{% extends "base.html" %}
{% load static %}

{% block title %}Verifique seu e-mail - Hevo{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-hevo p-4">
    <img src="{% static "branding/hevo_logo_white.png" %}" alt="Hevo" style="height: 72px;" class="mb-5">
    <div class="card p-4 text-center" style="width: 100%; max-width: 360px;">
        <h1 class="fs-5 mb-2">Verifique seu e-mail</h1>
        <p class="text-muted small mb-0">
            Se esse e-mail estiver cadastrado, você vai receber um link para
            redefinir sua senha em instantes.
        </p>
        <a href="{% url "login" %}" class="small text-muted d-block text-center mt-3">Voltar para o login</a>
    </div>
</div>
{% endblock %}
