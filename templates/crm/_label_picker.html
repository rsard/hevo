{% load crm_extras %}
<div class="d-flex flex-wrap align-items-center gap-2" id="label-picker">
    {% for label in lead.labels.all %}
    <span
        class="badge
            text-bg-{{ label.color|label_color }}"
        >
        {{ label.name }}
        <button
            type="button"
            class="btn-close ms-1"
            style="font-size: 0.55rem;"
            hx-post="{% url 'crm:lead-toggle-label' lead.pk label.pk %}"
            hx-target="#label-picker"
            hx-swap="outerHTML"
            title="Remover label"
            aria-label="Remover label"></button>
    </span>
    {% endfor %}
    <div class="dropdown">
        <button
            type="button"
            class="btn btn-outline-secondary btn-sm dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false">+ Label</button>
        <ul class="dropdown-menu p-2" style="min-width: 160px;">
            {% for label in unassigned_labels %}
            <li class="mb-1">
                <button
                    type="button"
                    class="btn btn-sm btn-link text-decoration-none p-0 text-start"
                    hx-post="{% url 'crm:lead-toggle-label' lead.pk label.pk %}"
                    hx-target="#label-picker"
                    hx-swap="outerHTML">
                    <span
                        class="badge text-bg-{{ label.color|label_color }}"
                        >{{ label.name }}</span>
                </button>
            </li>
            {% empty %}
            <li><span class="text-muted small">Nenhuma label disponível.</span></li>
            {% endfor %}
        </ul>
    </div>
</div>
