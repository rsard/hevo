{% extends 'base.html' %}
{% load static %}

{% block title %}Leads - Hevo{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h1>Leads</h1>
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-3" role="group">
                <span class="text-link active">Kanban</span>
                <a href="{% url 'crm:lead-table' %}" class="text-link">Tabela</a>
            </div>
            <input
                type="search"
                name="q"
                class="form-control"
                placeholder="Buscar por nome ou telefone"
                value="{{ query }}"
                hx-get="{% url 'crm:lead-list' %}{% querystring q=None %}"
                hx-trigger="keyup changed delay:300ms, search"
                hx-target="#kanban-container"
                hx-swap="outerHTML">
            <a
                href="{% url 'crm:lead-export' %}{% querystring %}"
                class="btn btn-outline-hevo text-nowrap">
                <i class="fa-solid fa-file-excel"></i> Exportar
            </a>
        </div>
    </div>

    {% include 'crm/_kanban_container.html' %}
</div>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"
    integrity="sha512-TelkP3PCMJv+viMWynjKcvLsQzx6dJHvIGhfqzFtZKgAjKM1YPqcwzzDEoTc/BHjf43PcPzTQOjuTr4YdE8lNQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
<script src="{% static 'js/kanban.js' %}"></script>
{% endblock %}
