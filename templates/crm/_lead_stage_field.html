<div id="lead-stage-field">
    <label class="form-label mb-1" for="lead-stage-select">Estágio</label>
    <select
        id="lead-stage-select"
        class="form-select form-select-sm"
        name="stage"
        hx-post="{% url 'crm:lead-stage-update' lead.pk %}"
        hx-trigger="change"
        hx-target="#lead-stage-field"
        hx-swap="outerHTML"
        hx-vals='{"render": "field"}'>
        {% for value, label in stages %}
        <option value="{{ value }}" {% if lead.stage == value %}selected{% endif %}>
            {{ label }}</option>
        {% endfor %}
    </select>
</div>
