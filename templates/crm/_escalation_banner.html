{% if lead.escalated_at %}
<div
    class="alert alert-danger d-flex justify-content-between align-items-center mb-4"
    id="escalation-banner">
    <span>
        <strong>Atendimento humano solicitado</strong> · há {{ lead.escalated_at|timesince }}.
        Respostas automáticas estão pausadas para este lead.
    </span>
    <form
        method="post"
        action="{% url 'crm:lead-resolve-escalation' lead.pk %}"
        hx-post="{% url 'crm:lead-resolve-escalation' lead.pk %}"
        hx-target="#escalation-banner"
        hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" class="btn btn-hevo btn-sm text-nowrap">
            Marcar como atendido</button>
    </form>
</div>
{% else %}
<div class="mb-4" id="escalation-banner">
    <form
        method="post"
        action="{% url 'crm:lead-escalate' lead.pk %}"
        hx-post="{% url 'crm:lead-escalate' lead.pk %}"
        hx-target="#escalation-banner"
        hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" class="filter-chip filter-chip-danger">
            <i class="fa-solid fa-hand"></i>
            Solicitar atendimento humano
        </button>
    </form>
</div>
{% endif %}
