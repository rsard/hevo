{% extends "base.html" %}

{% block title %}Label - Hevo{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <h1 class="mb-4">Configurações</h1>
    {% include "venue/_account_nav.html" %}
    <div class="card">
        <div class="card-body">
            <h2>{% if object %}Editar{% else %}Nova{% endif %} label</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-hevo">Salvar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
