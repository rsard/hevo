{% extends "base.html" %}

{% block title %}Excluir - Hevo{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <h1>{{ section_title|default:"Base de Conhecimento" }}</h1>
    {% if nav_template %}{% include nav_template %}{% endif %}
    <div class="card">
        <div class="card-body">
            <h2>Excluir "{{ object }}"?</h2>
            <p class="alert alert-warning">Esta ação não pode ser desfeita.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
