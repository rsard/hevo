{% extends 'base.html' %}

{% block title %}Tipo de evento - Hevo{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <h1>Base de Conhecimento</h1>
    {% include 'venue/_knowledge_base_nav.html' %}
    <div class="card">
        <div class="card-body">
            <h2>{% if object %}Editar{% else %}Novo{% endif %} tipo de evento</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-hevo">Salvar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
